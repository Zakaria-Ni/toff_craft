<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eaglercraft Launcher</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c0e;
    }

    button {
      background: #4ade80;
      color: #0b0c0e;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(74, 222, 128, 0.2);
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <button onclick="launchCode()">Launch Eaglercraft 1.16.5</button>

  <script>
    function launchCode() {
      // 1. Open a clean, fresh browser window
      let win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Popup blocked! Please allow popups for this site.');
        return;
      }

      // 2. Clean HTML content without hidden broken characters
      let content = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="0; url=https://acorndev.pages.dev/" />
<link rel="canonical" href="https://acorndev.pages.dev/" />
<title>Eaglercraft 1.16.5 &mdash; moved</title>
<script>window.location.replace("https://acorndev.pages.dev/");<\/script>
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #0b0c0e;
  color: #e6e8ea;
  font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
a { color: #4ade80; }
.d { color: #8b9199; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <div>
    <div>Eaglercraft 1.16.5 has moved</div>
    <div class="d">Redirecting to <a href="https://acorndev.pages.dev/">acorndev.pages.dev</a>&hellip;</div>
  </div>
</body>
</html>`;

      // 3. Inject the document code directly into the new window context
      win.document.open();
      win.document.write(content);
      win.document.close();
    }
  </script>

</body>

</html>
