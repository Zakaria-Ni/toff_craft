<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>toff craft</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 40px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    button {
      background-color: #1e1e1e;
      color: white;
      border: 2px solid #333;
      padding: 25px 20px;
      font-size: 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    button:hover {
      background-color: #2a2a2a;
      border-color: #007aff;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <h1>toff craft</h1>
  <p class="subtitle">Select a game below to launch it inside a clean about:blank tab.</p>

  <div class="game-grid">
    <button onclick="launchGame('csgo-clicker.html')">🕹️ CSGO Clicker</button>
    <button onclick="launchGame('dogeminer.html')">🐕 Dogeminer</button>
    <button onclick="launchGame('escape-runway-2.html')">🏃 Escape Runway 2</button>
    <button onclick="launchGame('sky-race-3d.html')">🚀 Sky Race 3D</button>
    <button onclick="launchGame('backrooms.html')">🕳️ Backrooms</button>
    <button onclick="launchGame('granny.html')">👵 Granny</button>
    <button onclick="launchGame('minecraft-1122.html')">⛏️ Minecraft 1.12.2</button>
    <button onclick="launchGame('minecraft-1162.html')">🧱 Minecraft 1.16.2</button>
    <button onclick="launchGame('summer-rider-3d.html')">🏍️ Summer Rider 3D</button>
    <button onclick="launchGame('99-nights.html')">🌲 99 Nights in the Forest</button>
  </div>

  <script>
    function launchGame(gameFile) {
      var win = window.open('about:blank', '_blank');
      win.document.body.style.margin = '0';
      win.document.body.style.height = '100vh';
      win.document.body.style.backgroundColor = '#000';

      var iframe = win.document.createElement('iframe');
      iframe.style.border = 'none';
      iframe.style.width = '100%';
      iframe.style.height = '100%';

      // Connects directly to your repository deployment branch
      iframe.src = 'https://github.io' + gameFile;

      win.document.body.appendChild(iframe);
    }
  </script>

</body>

</html>
